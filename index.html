<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- 안전 장치: 이 페이지는 다른 사이트에 아무것도 요청할 수 없습니다 (광고, 추적, 외부 링크 차단).
     'self'는 같은 폴더의 그림·아이콘·manifest·오프라인용 sw.js만 허용합니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'">
<title>정령 친구 합체!</title>
<meta name="theme-color" content="#bfe4ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정령 합체">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
  html,body{margin:0;height:100%;background:#fff4dd linear-gradient(#bfe4ff,#fff4dd 45%,#d9f3c6);overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;box-sizing:border-box;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 420, H = 780, COLS = 5, ROWS = 3, N = COLS * ROWS, CELL = 76;
const GX = (W - COLS * CELL) / 2, EY = 84, PY = 404, MAXLV = 99, HYBRID_LV = 20;
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";

/* ---------- 원소와 혼합 ---------- */
// 상성: 물 > 불 > 바람 > 땅 > 전기 > 물
const EL = {
  water:    { label:'물',   c:'#4aa8ff', beats:['fire'],     base:{ hp:34, atk:5, range:44,  spd:46, cd:0.9 } },
  fire:     { label:'불',   c:'#ff7a3c', beats:['wind'],     base:{ hp:22, atk:8, range:44,  spd:58, cd:0.9 } },
  wind:     { label:'바람', c:'#9fb4d6', beats:['earth'],    base:{ hp:20, atk:6, range:190, spd:44, cd:1.15 } },
  earth:    { label:'땅',   c:'#9a7b55', beats:['electric'], base:{ hp:40, atk:5, range:44,  spd:40, cd:1.0 } },
  electric: { label:'전기', c:'#ffd21f', beats:['water'],    base:{ hp:22, atk:7, range:120, spd:52, cd:0.8 } },
};
const ELS = ['water', 'fire', 'wind', 'earth', 'electric'];
const HY = {
  wind_electric:  { pair:['wind','electric'],  c:'#a58cff', names:['뇌구름','번개 회오리','뇌조','번개 늑대','뇌폭룡'] },
  water_electric: { pair:['water','electric'], c:'#3fd0ff', names:['찌릿방울','번개여우','해일늑대','뇌해사자','뇌해룡'] },
  earth_water:    { pair:['earth','water'],    c:'#5fae8e', names:['진흙콩','이끼바위','바위방울','소용돌흙','샘물골렘'] },
  earth_fire:     { pair:['earth','fire'],     c:'#e0582a', names:['화산콩','용암뿔이','화산거인','마그마왕','화염고목룡'] },
};
for (const k in HY) {
  const [a, b] = HY[k].pair, A = EL[a].base, B = EL[b].base;
  HY[k].label = EL[a].label + '+' + EL[b].label;
  HY[k].beats = EL[a].beats.concat(EL[b].beats);
  HY[k].base = { hp:(A.hp + B.hp) * 0.65, atk:(A.atk + B.atk) * 0.65, range:Math.max(A.range, B.range), spd:Math.max(A.spd, B.spd), cd:Math.min(A.cd, B.cd) };
}
const info = k => EL[k] || HY[k];
const isHybrid = k => !!HY[k];
function hybridOf(a, b) {
  for (const k in HY) { const p = HY[k].pair; if ((p[0] === a && p[1] === b) || (p[0] === b && p[1] === a)) return k; }
  return null;
}
const band = lv => Math.floor(lv / HYBRID_LV);
// 두 친구가 합쳐지면 무엇이 되는지 (안 되면 null)
function mergeResult(a, b) {
  if (!a || !b) return null;
  if (a.el === b.el && a.lv === b.lv && a.lv < MAXLV) return { el:a.el, lv:a.lv + 1 };
  if (!isHybrid(a.el) && !isHybrid(b.el) && a.el !== b.el && a.lv >= HYBRID_LV && b.lv >= HYBRID_LV && band(a.lv) === band(b.lv)) {
    const h = hybridOf(a.el, b.el);
    if (h) return { el:h, lv:Math.min(MAXLV, Math.max(a.lv, b.lv) + 1) };
  }
  return null;
}
function stats(k, lv) {
  const b = info(k).base, m = Math.pow(1.38, lv - 1);
  return { maxhp: b.hp * m, atk: b.atk * m, range: b.range, spd: b.spd, cd: b.cd };
}
function unitName(u) {
  if (isHybrid(u.el)) return HY[u.el].names[hyForm(u.lv)];
  return info(u.el).label + ' 정령';
}

/* ---------- 그림 (assets 폴더의 스프라이트 묶음) ---------- */
const SPR = 160;
const SHEETS = { fire:50, wind:50, electric:50, earth:50, water:47, wind_electric:5, water_electric:5, earth_water:5, earth_fire:5 };
const IMGS = {};
for (const k in SHEETS) { const im = new Image(); im.src = 'assets/' + k + '.webp'; IMGS[k] = im; }
const hyForm = lv => lv >= MAXLV ? 4 : Math.max(0, Math.min(3, band(lv) - 1));
const SKIP = { fire: 2 }; // 불 Lv1~2 그림(작은 불씨)은 너무 작아서 건너뜀
function spriteIndex(k, lv) {
  if (isHybrid(k)) return hyForm(lv);
  const s = SKIP[k] || 0, n = SHEETS[k] - s;
  return s + Math.min(n - 1, Math.floor((lv - 1) * n / MAXLV));
}
const sprCache = {};
// 한 칸을 잘라 캔버스로 보관 (적은 붉은 빛을 둘러서 미리 그려 둠)
function sprite(k, idx, foe) {
  const key = k + idx + (foe ? 'e' : '');
  if (sprCache[key]) return sprCache[key];
  const im = IMGS[k];
  if (!im.complete || !im.naturalWidth) return null;
  const cols = SHEETS[k] > 5 ? 10 : 5, pad = 12;
  const c = document.createElement('canvas'); c.width = c.height = SPR + pad * 2;
  const g = c.getContext('2d');
  if (foe) { g.shadowColor = 'rgba(230,20,90,0.95)'; g.shadowBlur = 10; }
  g.drawImage(im, (idx % cols) * SPR, Math.floor(idx / cols) * SPR, SPR, SPR, pad, pad, SPR, SPR);
  if (foe) g.drawImage(c, 0, 0); // 빛을 한 번 더 진하게
  return (sprCache[key] = c);
}

/* ---------- 저장 (이 기기 안에만) ---------- */
const SAVE = 'spirit-pals-v2';
function fresh() { return { coins:20, stage:1, grid:Array(N).fill(null), found:{}, merged:0, muted:false }; }
function load() {
  try {
    let s = JSON.parse(localStorage.getItem(SAVE));
    if (!s) { // 예전 버전 저장을 이어받기 (풀 → 땅)
      s = JSON.parse(localStorage.getItem('spirit-pals-v1'));
      if (s && Array.isArray(s.grid)) { s.grid = s.grid.map(u => u && { el: u.el === 'grass' ? 'earth' : u.el, lv: u.lv }); s.found = {}; }
    }
    if (s && Array.isArray(s.grid) && s.grid.length === N) {
      s.grid = s.grid.map(u => u && info(u.el) ? { el:u.el, lv:Math.max(1, Math.min(MAXLV, u.lv | 0)) } : null);
      return Object.assign(fresh(), s);
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
let S = load();
const summonLv = st => Math.min(MAXLV - 2, 1 + Math.floor((st - 1) * 0.5));
const cost = () => 4 + Math.floor(S.stage * 0.6);
const winReward = st => 12 + st * 3;
const loseReward = st => 4 + st;

/* ---------- 상대 만들기 (스테이지마다 항상 같은 배치) ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genEnemies(st) {
  const R = rng(st * 7919 + 17), sl = summonLv(st);
  let b = Math.min(24, 2 + Math.floor(st * 0.45));
  const maxOff = Math.min(5, 1 + Math.floor(st / 5));
  const g = Array(N).fill(null);
  while (b > 0) {
    const off = Math.floor(R() * (Math.min(maxOff, Math.floor(Math.log2(b))) + 1));
    const empty = []; g.forEach((u, i) => { if (!u) empty.push(i); });
    if (!empty.length) break;
    const front = empty.filter(i => i >= 2 * COLS);
    const pool = front.length && R() < 0.6 ? front : empty;
    const i = pool[Math.floor(R() * pool.length)];
    const lv = Math.min(MAXLV, sl + off);
    let el = ELS[Math.floor(R() * ELS.length)];
    if (lv >= HYBRID_LV && R() < 0.3) { const ks = Object.keys(HY); el = ks[Math.floor(R() * ks.length)]; }
    g[i] = { el, lv };
    b -= 1 << off;
  }
  return g;
}
let enemy = genEnemies(S.stage);

/* ---------- 소리 (기기 안에서 직접 만듦) ---------- */
let AC = null;
function beep(f, d = 0.12, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  if (S.muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
const tune = (notes, step = 0.09, type = 'triangle') => notes.forEach((f, i) => beep(f, 0.18, type, 0.1, 0, i * step));

/* ---------- 화면 크기 ---------- */
let scale = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(w / W, h / H); ox = (w - W * scale) / 2; oy = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

/* ---------- 효과 ---------- */
let parts = [], texts = [], rings = [], toastMsg = null, pops = Array(N).fill(0);
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.6 + Math.random() * 0.4, t: 0, color, r: 3 + Math.random() * 4 });
  }
}
function floatText(x, y, txt, color) { texts.push({ x, y, txt, color, t: 0 }); }
function toast(txt, dur = 2) { toastMsg = { txt, t: 0, dur }; }
function fmt(n) {
  n = Math.round(n);
  if (n < 1e4) return String(n);
  if (n < 1e8) return (n / 1e4).toFixed(n < 1e5 ? 1 : 0) + '만';
  if (n < 1e12) return (n / 1e8).toFixed(n < 1e9 ? 1 : 0) + '억';
  if (n < 1e16) return (n / 1e12).toFixed(n < 1e13 ? 1 : 0) + '조';
  return (n / 1e16).toFixed(0) + '경';
}

/* ---------- 그리기 도우미 ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function text(t, x, y, size, color, align = 'center', weight = 'bold') {
  ctx.font = weight + ' ' + size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function outlined(t, x, y, size, color, stroke = '#3b2b4f') {
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function coinIcon(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#ffc93c'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#c98a12'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.strokeStyle = '#e8a923'; ctx.stroke();
}

// 캐릭터 그리기: 숨쉬기·통통 튀기·흔들림 애니메이션은 여기서 만듦
// opt: { s: 크기 배율, alpha, flip, hit, lunge, badge }
function drawUnit(x, y, k, lv, foe, opt = {}) {
  const s = opt.s || 1, t = now, ph = x * 0.071 + y * 0.037;
  const size = (46 + lv * 0.28 + (isHybrid(k) ? 6 : 0)) * s;
  const breathe = Math.sin(t * 3.1 + ph) * 0.035;
  const bob = Math.abs(Math.sin(t * 2.2 + ph)) * -2.5 * s;
  const sway = Math.sin(t * 1.7 + ph) * 0.04;
  ctx.save();
  ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
  // 그림자
  ctx.fillStyle = 'rgba(40,20,60,0.16)';
  ctx.beginPath(); ctx.ellipse(x, y + size * 0.42, size * 0.36 * (1 - bob / 30), size * 0.09, 0, 0, Math.PI * 2); ctx.fill();
  const img = sprite(k, spriteIndex(k, lv), foe);
  ctx.translate(x, y + size * 0.45 + bob);
  ctx.rotate(sway);
  ctx.scale((opt.flip ? -1 : 1) * (1 - breathe * 0.6), 1 + breathe);
  if (img) {
    const d = size * (img.width / SPR);
    ctx.drawImage(img, -d / 2, -d + size * (12 / SPR), d, d);
    if (opt.hit > 0) { // 맞으면 하얗게 번쩍
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= Math.min(1, opt.hit * 6) * 0.6;
      ctx.drawImage(img, -d / 2, -d + size * (12 / SPR), d, d);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    ctx.beginPath(); ctx.arc(0, -size * 0.4, size * 0.35, 0, Math.PI * 2); ctx.fillStyle = info(k).c; ctx.fill();
  }
  ctx.restore();
  if (opt.badge !== false) {
    const bx = x + size * 0.36, by = y + size * 0.36, w = lv >= 10 ? 22 : 16;
    rr(bx - w / 2, by - 8, w, 16, 8);
    ctx.fillStyle = foe ? '#ff4d7a' : (isHybrid(k) ? '#ffd23f' : '#fff'); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = foe ? '#7a1030' : '#3b2b4f'; ctx.stroke();
    text(String(lv), bx, by + 0.5, 11, foe ? '#fff' : '#3b2b4f');
  }
}

/* ---------- 버튼 ---------- */
let btns = [];
function button(x, y, w, h, label, color, fn, sub, disabled) {
  ctx.save();
  rr(x, y + 5, w, h, 18); ctx.fillStyle = 'rgba(60,30,80,0.25)'; ctx.fill();
  rr(x, y, w, h, 18); ctx.fillStyle = disabled ? '#cfc6d8' : color; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,80,0.35)'; ctx.stroke();
  if (sub) { outlined(label, x + w / 2, y + h / 2 - 12, 21, '#fff'); sub(x + w / 2, y + h / 2 + 16); }
  else outlined(label, x + w / 2, y + h / 2, 24, '#fff');
  ctx.restore();
  btns.push({ x, y, w, h, fn });
}

/* ---------- 게임 흐름 ---------- */
let mode = 'merge', B = null, speed = 1, result = null, drag = null, now = 0;

function cellPos(side, i) {
  const c = i % COLS, r = Math.floor(i / COLS), y0 = side === 'p' ? PY : EY;
  return { x: GX + c * CELL + CELL / 2, y: y0 + r * CELL + CELL / 2 - 4 };
}
function cellAt(x, y) {
  const c = Math.floor((x - GX) / CELL), r = Math.floor((y - PY) / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return r * COLS + c;
}
function discover(u) {
  const key = u.el + ':' + spriteIndex(u.el, u.lv);
  if (S.found[key]) return false;
  S.found[key] = 1;
  return true;
}

function buy() {
  const c = cost();
  const empty = []; S.grid.forEach((u, i) => { if (!u) empty.push(i); });
  if (!empty.length) { toast('자리가 꽉 찼어요! 같은 친구끼리 합체해 봐요'); beep(200, 0.15, 'square', 0.05); return; }
  if (S.coins < c) { toast('코인이 모자라요. 싸워서 코인을 모아요!'); beep(200, 0.15, 'square', 0.05); return; }
  S.coins -= c;
  const i = empty[Math.floor(Math.random() * empty.length)];
  const el = ELS[Math.floor(Math.random() * ELS.length)];
  const u = { el, lv: summonLv(S.stage) };
  S.grid[i] = u; pops[i] = 1;
  const p = cellPos('p', i); burst(p.x, p.y, EL[el].c, 8);
  beep(520, 0.1, 'triangle', 0.1, 1.6);
  if (discover(u)) toast('새 친구! ' + unitName(u) + ' Lv.' + u.lv, 1.6);
  save();
}

function mkF(side, u, i) {
  const p = cellPos(side, i), s = stats(u.el, u.lv);
  return Object.assign({ side, el: u.el, lv: u.lv, x: p.x, y: p.y, hp: s.maxhp, cdT: Math.random() * 0.5, lunge: 0, hit: 0, dead: false, deadT: 0, look: side === 'p' ? -Math.PI / 2 : Math.PI / 2 }, s);
}
function startBattle() {
  if (!S.grid.some(Boolean)) { toast('먼저 "친구 부르기"를 눌러요!'); return; }
  const F = [];
  S.grid.forEach((u, i) => { if (u) F.push(mkF('p', u, i)); });
  enemy.forEach((u, i) => { if (u) F.push(mkF('e', u, i)); });
  B = { F, proj: [], t: 0, over: null, overT: 0 };
  mode = 'battle'; speed = 1;
  tune([523, 659, 784], 0.07, 'square');
}
function hitF(a, b) {
  if (b.dead) return;
  const adv = info(a.el).beats.includes(isHybrid(b.el) ? null : b.el) ||
              (isHybrid(b.el) && HY[b.el].pair.some(p => info(a.el).beats.includes(p)));
  const dmg = Math.max(1, a.atk * (adv ? 1.6 : 1) * (0.9 + Math.random() * 0.2));
  b.hp -= dmg; b.hit = 0.15;
  floatText(b.x + (Math.random() - 0.5) * 16, b.y - 26, adv ? '최고! ' + fmt(dmg) : fmt(dmg), adv ? '#ffd23f' : '#fff');
  beep(adv ? 700 : 420, 0.06, 'triangle', 0.05);
  if (b.hp <= 0) { b.dead = true; b.deadT = 0; burst(b.x, b.y, info(b.el).c, 14); beep(330, 0.2, 'sine', 0.08, 0.5); }
}
function stepBattle(dt) {
  B.t += dt;
  const F = B.F;
  for (const f of F) {
    if (f.dead) { f.deadT += dt; continue; }
    f.cdT -= dt; f.lunge = Math.max(0, f.lunge - dt); f.hit = Math.max(0, f.hit - dt);
    let best = null, bd = 1e9;
    for (const g of F) { if (g.dead || g.side === f.side) continue; const d = Math.hypot(g.x - f.x, g.y - f.y); if (d < bd) { bd = d; best = g; } }
    if (!best) continue;
    f.look = Math.atan2(best.y - f.y, best.x - f.x);
    if (bd > f.range) { const k = Math.min(1, f.spd * dt / bd); f.x += (best.x - f.x) * k; f.y += (best.y - f.y) * k; }
    else if (f.cdT <= 0) {
      f.cdT = f.cd; f.lunge = 0.18;
      if (f.range > 60) { B.proj.push({ x: f.x, y: f.y - 14, t: best, src: f }); beep(900, 0.05, 'sine', 0.03, 0.6); }
      else hitF(f, best);
    }
    for (const g of F) {
      if (g === f || g.dead || g.side !== f.side) continue;
      const dx = f.x - g.x, dy = f.y - g.y, d = Math.hypot(dx, dy) || 0.01;
      if (d < 34) { const p = (34 - d) / d * Math.min(1, dt * 6); f.x += dx * p * 0.5; f.y += dy * p * 0.5; }
    }
    f.x = Math.max(22, Math.min(W - 22, f.x)); f.y = Math.max(EY + 10, Math.min(PY + ROWS * CELL - 10, f.y));
  }
  B.proj = B.proj.filter(p => {
    if (p.t.dead) return false;
    const dx = p.t.x - p.x, dy = p.t.y - 14 - p.y, d = Math.hypot(dx, dy);
    if (d < 12) { hitF(p.src, p.t); return false; }
    const k = Math.min(1, 330 * dt / d); p.x += dx * k; p.y += dy * k; return true;
  });
  if (!B.over) {
    const pa = F.some(f => !f.dead && f.side === 'p'), ea = F.some(f => !f.dead && f.side === 'e');
    if (!ea) B.over = 'win'; else if (!pa || B.t > 90) B.over = 'lose';
  } else {
    B.overT += dt;
    if (B.overT > 1.0) endBattle(B.over === 'win');
  }
}
function endBattle(win) {
  const reward = win ? winReward(S.stage) : loseReward(S.stage);
  S.coins += reward;
  const oldSl = summonLv(S.stage);
  result = { win, reward, stage: S.stage };
  if (win) {
    S.stage++;
    result.slUp = summonLv(S.stage) > oldSl ? summonLv(S.stage) : 0;
    tune([523, 659, 784, 1047, 1319], 0.1);
    for (let i = 0; i < 5; i++) burst(60 + i * 75, 300, info(ELS[i]).c, 14);
  } else tune([440, 392, 349], 0.15, 'sine');
  save(); mode = 'result';
}
function closeResult() { mode = 'merge'; B = null; result = null; enemy = genEnemies(S.stage); beep(660, 0.08); }

/* ---------- 입력 ---------- */
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (AC && AC.state === 'suspended') AC.resume();
  const p = toLogical(e);
  for (let k = btns.length - 1; k >= 0; k--) {
    const b = btns[k];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (mode !== 'merge') return;
  const i = cellAt(p.x, p.y);
  if (i >= 0 && S.grid[i]) { drag = { i, x: p.x, y: p.y, sx: p.x, sy: p.y }; cv.setPointerCapture(e.pointerId); beep(600, 0.04, 'sine', 0.05); }
});
cv.addEventListener('pointermove', e => { if (!drag) return; const p = toLogical(e); drag.x = p.x; drag.y = p.y; });
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  const j = cellAt(d.x, d.y), a = S.grid[d.i];
  if (!a) return;
  if (Math.hypot(d.x - d.sx, d.y - d.sy) < 8) { // 톡 누르면 이름 보기
    const st = stats(a.el, a.lv);
    let tip = '';
    if (!isHybrid(a.el) && a.lv >= HYBRID_LV) {
      const mates = Object.values(HY).filter(h => h.pair.includes(a.el)).map(h => EL[h.pair[0] === a.el ? h.pair[1] : h.pair[0]].label);
      if (mates.length) tip = '  · ' + mates.join('/') + '와 혼합 가능';
    }
    toast(unitName(a) + ' Lv.' + a.lv + '  체력 ' + fmt(st.maxhp) + ' · 힘 ' + fmt(st.atk) + tip, 2.2);
    return;
  }
  if (j < 0 || j === d.i) return;
  const b = S.grid[j];
  const m = mergeResult(a, b);
  if (!b) { S.grid[j] = a; S.grid[d.i] = null; pops[j] = 0.5; beep(500, 0.05); }
  else if (m) {
    const hybridNew = m.el !== a.el;
    const evolved = spriteIndex(m.el, m.lv) !== spriteIndex(a.el, a.lv) || hybridNew;
    S.grid[j] = m; S.grid[d.i] = null; pops[j] = 1; S.merged++;
    const p = cellPos('p', j);
    burst(p.x, p.y, info(a.el).c, 16); burst(p.x, p.y, info(b.el).c, hybridNew ? 16 : 0); burst(p.x, p.y, '#fff7b0', 8);
    rings.push({ x: p.x, y: p.y, t: 0, color: info(m.el).c });
    if (hybridNew) { rings.push({ x: p.x, y: p.y, t: -0.15, color: '#ffd23f' }); tune([523, 659, 784, 1047, 1319, 1568], 0.07); }
    else { const f = Math.pow(1.012, m.lv); tune([523 * f, 659 * f, 784 * f], 0.06); }
    const fresh = discover(m);
    if (hybridNew) toast('혼합 진화! ' + unitName(m) + ' Lv.' + m.lv, 2.4);
    else if (evolved && fresh) toast('진화! ' + unitName(m) + ' Lv.' + m.lv, 1.8);
  } else if (b.el === a.el && b.lv === a.lv) { toast('이미 최고 레벨이에요!'); }
  else { S.grid[j] = a; S.grid[d.i] = b; pops[j] = 0.4; pops[d.i] = 0.4; beep(450, 0.05); }
  save();
});
cv.addEventListener('pointercancel', () => { drag = null; });

function resetAll() {
  if (confirm('처음부터 다시 할까요? 모은 친구와 코인이 모두 사라져요.')) {
    const m = S.muted; S = fresh(); S.muted = m; save(); enemy = genEnemies(1); toast('새로 시작해요!');
  }
}
function toggleMute() { S.muted = !S.muted; save(); beep(660, 0.08); }

/* ---------- 화면 그리기 ---------- */
function drawBoard() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#bfe4ff'); g.addColorStop(0.45, '#fff4dd'); g.addColorStop(1, '#d9f3c6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  rr(GX - 8, EY - 4, COLS * CELL + 16, ROWS * CELL + 12, 22); ctx.fillStyle = 'rgba(150,110,200,0.16)'; ctx.fill();
  rr(GX - 8, PY - 4, COLS * CELL + 16, ROWS * CELL + 12, 22); ctx.fillStyle = 'rgba(100,190,100,0.2)'; ctx.fill();
  const showCells = mode !== 'battle';
  const dragU = drag && S.grid[drag.i];
  for (let i = 0; i < N; i++) {
    const c = i % COLS, r = Math.floor(i / COLS);
    if (showCells) { rr(GX + c * CELL + 4, EY + r * CELL + 4, CELL - 8, CELL - 8, 14); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill(); }
    rr(GX + c * CELL + 4, PY + r * CELL + 4, CELL - 8, CELL - 8, 14);
    let hl = null;
    if (dragU && i !== drag.i) { const m = mergeResult(dragU, S.grid[i]); if (m) hl = m.el !== dragU.el ? 'hy' : 'same'; }
    ctx.fillStyle = hl === 'hy' ? 'rgba(190,150,255,0.8)' : hl ? 'rgba(255,230,90,0.75)' : showCells ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.25)'; ctx.fill();
    if (hl) { ctx.lineWidth = 3; ctx.strokeStyle = hl === 'hy' ? '#7b4dff' : '#f0a500'; ctx.stroke(); }
  }
  text('말썽 정령들', W / 2, EY - 13, 12, '#6b4a8f');
}

function drawMiddle() {
  if (mode === 'battle') return;
  const my = (EY + ROWS * CELL + PY) / 2 - 6;
  // 상성표: 물 ▶ 불 ▶ 바람 ▶ 땅 ▶ 전기 ▶ 물
  const order = ['water', 'fire', 'wind', 'earth', 'electric', 'water'];
  const pick = { water: 30, fire: 12, wind: 44, earth: 12, electric: 16 }; // 원소가 잘 보이는 모습
  order.forEach((el, k) => {
    const x = 38 + k * 69;
    drawUnit(x, my - 10, el, pick[el], false, { s: 0.62, badge: false });
    if (k < 5) outlined('▶', x + 35, my - 4, 14, '#ffd23f', '#a06a00');
  });
  text('▶ 쪽을 이겨요 · 바람과 전기는 멀리서 쏴요 · Lv' + HYBRID_LV + '부터 혼합!', W / 2, my + 26, 11.5, '#6b4a8f');
}

function drawTop() {
  rr(10, 10, W - 20, 50, 18); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
  outlined('스테이지 ' + S.stage, 82, 35, 20, '#ff8a4c', '#7a3510');
  coinIcon(190, 35, 12); outlined(fmt(S.coins), 240, 35, 21, '#ffd23f', '#8a5a00');
  const mx = W - 58, my = 16;
  rr(mx, my, 40, 38, 12); ctx.fillStyle = S.muted ? '#cfc6d8' : '#8fd3ff'; ctx.fill();
  ctx.fillStyle = '#3b2b4f'; ctx.beginPath();
  ctx.moveTo(mx + 9, my + 15); ctx.lineTo(mx + 15, my + 15); ctx.lineTo(mx + 22, my + 9); ctx.lineTo(mx + 22, my + 29);
  ctx.lineTo(mx + 15, my + 23); ctx.lineTo(mx + 9, my + 23); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3b2b4f'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath();
  if (S.muted) { ctx.moveTo(mx + 26, my + 14); ctx.lineTo(mx + 34, my + 24); ctx.moveTo(mx + 34, my + 14); ctx.lineTo(mx + 26, my + 24); }
  else { ctx.arc(mx + 23, my + 19, 7, -0.9, 0.9); ctx.moveTo(mx + 23 + 11 * Math.cos(-0.9), my + 19 + 11 * Math.sin(-0.9)); ctx.arc(mx + 23, my + 19, 11, -0.9, 0.9); }
  ctx.stroke();
  btns.push({ x: mx, y: my, w: 40, h: 38, fn: toggleMute });
}

function drawMergeUnits() {
  enemy.forEach((u, i) => { if (u) { const p = cellPos('e', i); drawUnit(p.x, p.y, u.el, u.lv, true, { flip: true }); } });
  S.grid.forEach((u, i) => {
    if (!u || (drag && drag.i === i)) return;
    const p = cellPos('p', i), k = pops[i];
    drawUnit(p.x, p.y, u.el, u.lv, false, { s: 1 + Math.sin(k * Math.PI) * 0.25 });
  });
  if (drag) { const u = S.grid[drag.i]; if (u) drawUnit(drag.x, drag.y - 14, u.el, u.lv, false, { s: 1.15, alpha: 0.92 }); }
}

function drawBattle() {
  const F = B.F.slice().sort((a, b) => a.y - b.y);
  for (const f of F) {
    if (f.dead && f.deadT > 0.4) continue;
    const lz = Math.sin(f.lunge / 0.18 * Math.PI) * 10;
    const sh = f.hit > 0 ? (Math.random() - 0.5) * 4 : 0;
    drawUnit(f.x + Math.cos(f.look) * lz + sh, f.y + Math.sin(f.look) * lz, f.el, f.lv, f.side === 'e',
      { s: f.dead ? 1 - f.deadT : 1, alpha: f.dead ? 1 - f.deadT / 0.4 : 1, flip: Math.cos(f.look) < 0, hit: f.hit, badge: false });
    if (!f.dead) {
      const w = 34, y = f.y - 44;
      rr(f.x - w / 2, y, w, 6, 3); ctx.fillStyle = 'rgba(40,20,60,0.4)'; ctx.fill();
      rr(f.x - w / 2, y, w * Math.max(0, f.hp / f.maxhp), 6, 3); ctx.fillStyle = f.side === 'p' ? '#5fd35f' : '#ff6b6b'; ctx.fill();
    }
  }
  for (const p of B.proj) {
    const col = info(p.src.el).c;
    if (p.src.el.includes('electric')) { // 지그재그 번개
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x - 6, p.y - 6);
      ctx.lineTo(p.x + 2, p.y - 1); ctx.lineTo(p.x - 2, p.y + 1); ctx.lineTo(p.x + 6, p.y + 6); ctx.stroke();
    } else {
      ctx.fillStyle = col; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 4, now * 12, now * 12 + 4); ctx.stroke();
    }
  }
  if (B.over) outlined(B.over === 'win' ? '이겼다!' : '앗...', W / 2, 360, 44, B.over === 'win' ? '#ffd23f' : '#cfd8ff');
}

function drawBottom() {
  if (mode === 'battle') {
    button(GX, 654, COLS * CELL, 78, speed === 1 ? '빠르게 보기 ▶▶' : '천천히 보기 ▶', '#8fb8ff', () => { speed = speed === 1 ? 2.5 : 1; beep(700, 0.05); });
    return;
  }
  const c = cost(), full = !S.grid.includes(null);
  if (S.merged === 0 && S.grid.filter(Boolean).length >= 2) text('같은 친구 둘을 끌어다 겹치면 합체해요!', W / 2, 642, 14, '#c94a1a');
  else if (S.grid.some(u => u && !isHybrid(u.el) && u.lv >= HYBRID_LV)) text('Lv' + HYBRID_LV + '+ 다른 원소끼리 겹치면 혼합 진화!', W / 2, 642, 13, '#7b4dff');
  button(GX, 654, 182, 78, '친구 부르기', '#ffa24c', buy, (x, y) => {
    coinIcon(x - 40, y, 9); outlined(fmt(c), x - 16, y, 16, '#fff');
    outlined('Lv.' + summonLv(S.stage), x + 36, y, 15, '#fff6c0', '#7a3510');
  }, S.coins < c || full);
  button(GX + COLS * CELL - 182, 654, 182, 78, '싸우자!', '#ff6b8a', startBattle, null, !S.grid.some(Boolean));
  text('처음부터 다시', W / 2, 760, 12, 'rgba(90,70,110,0.55)', 'center', 'normal');
  btns.push({ x: W / 2 - 50, y: 748, w: 100, h: 26, fn: resetAll });
}

function drawResult() {
  ctx.fillStyle = 'rgba(40,20,60,0.45)'; ctx.fillRect(0, 0, W, H);
  rr(40, 220, W - 80, 310, 28); ctx.fillStyle = '#fffaf0'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = result.win ? '#ffb02e' : '#a7b4e0'; ctx.stroke();
  if (result.win) {
    outlined('승리!', W / 2, 280, 48, '#ffd23f', '#a05a00');
    text('스테이지 ' + result.stage + ' 통과!', W / 2, 326, 20, '#5a3d7a');
    if (result.slUp) text('이제 Lv.' + result.slUp + ' 친구를 부를 수 있어요!', W / 2, 356, 16, '#c94a1a');
  } else {
    outlined('아쉬워요!', W / 2, 280, 42, '#a7c4ff', '#3a4a8a');
    text('합체해서 더 강해진 다음', W / 2, 326, 18, '#5a3d7a');
    text('다시 도전해 봐요!', W / 2, 352, 18, '#5a3d7a');
  }
  coinIcon(W / 2 - 34, 392, 13); outlined('+' + fmt(result.reward), W / 2 + 14, 392, 26, '#ffd23f', '#8a5a00');
  btns = [];
  button(90, 430, W - 180, 66, result.win ? '다음 스테이지' : '다시 준비하기', result.win ? '#5fc95f' : '#8fb8ff', closeResult);
}

function drawFx(dt) {
  parts = parts.filter(p => (p.t += dt) < p.life);
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  rings = rings.filter(r => (r.t += dt) < 0.5);
  for (const r of rings) {
    if (r.t < 0) continue;
    ctx.globalAlpha = 1 - r.t / 0.5; ctx.strokeStyle = r.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 120, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  texts = texts.filter(t => (t.t += dt) < 0.8);
  for (const t of texts) { ctx.globalAlpha = 1 - t.t / 0.8; outlined(t.txt, t.x, t.y - t.t * 30, 15, t.color); }
  ctx.globalAlpha = 1;
  if (toastMsg) {
    toastMsg.t += dt;
    if (toastMsg.t > toastMsg.dur) toastMsg = null;
    else {
      const a = Math.min(1, toastMsg.t * 6, (toastMsg.dur - toastMsg.t) * 4);
      ctx.globalAlpha = a; ctx.font = 'bold 15px ' + FONT;
      const w = Math.min(W - 16, ctx.measureText(toastMsg.txt).width + 30);
      rr(W / 2 - w / 2, 340, w, 40, 20); ctx.fillStyle = 'rgba(59,43,79,0.92)'; ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(W / 2 - w / 2 + 8, 340, w - 16, 40); ctx.clip();
      text(toastMsg.txt, W / 2, 361, 15, '#fff'); ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  for (let i = 0; i < N; i++) pops[i] = Math.max(0, pops[i] - dt * 3);
  if (mode === 'battle') stepBattle(dt * speed);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.imageSmoothingQuality = 'high';
  btns = [];
  drawBoard();
  drawMiddle();
  if (mode === 'battle') drawBattle(); else drawMergeUnits();
  drawTop();
  drawBottom();
  if (mode === 'result') drawResult();
  drawFx(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 인터넷 없이도 실행되도록 (https 주소로 열었을 때만 동작)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
