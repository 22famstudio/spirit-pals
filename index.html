<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- 안전 장치: 이 페이지는 다른 사이트에 아무것도 요청할 수 없습니다 (광고, 추적, 외부 링크 차단).
     'self'는 같은 폴더의 그림·아이콘·manifest·오프라인용 sw.js만 허용합니다. -->

<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// 가로 화면 기준 크기
const W = 960, H = 540, COLS = 3, ROWS = 5, N = COLS * ROWS, CELL = 72;
const PX = 120, EX = 624, GY = 76;              // 내 칸 / 상대 칸 / 위쪽 여백
const MAXLV = 99, HYBRID_LV = 20, MAXSTAGE = 300;
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";

/* ---------- 원소와 혼합 ---------- */
// 상성: 물 > 불 > 바람 > 땅 > 전기 > 물
const EL = {
  // Lv1은 모두 힘 1, 체력 5. 원소마다 다른 건 사거리·속도뿐
  water:    { label:'물',   c:'#4aa8ff', beats:['fire'],     base:{ hp:5, atk:1, range:44,  spd:46, cd:1.0 } },
  fire:     { label:'불',   c:'#ff7a3c', beats:['wind'],     base:{ hp:5, atk:1, range:44,  spd:58, cd:1.0 } },
  wind:     { label:'바람', c:'#9fb4d6', beats:['earth'],    base:{ hp:5, atk:1, range:150, spd:44, cd:1.0 } },
  earth:    { label:'땅',   c:'#9a7b55', beats:['electric'], base:{ hp:5, atk:1, range:44,  spd:40, cd:1.0 } },
  electric: { label:'전기', c:'#ffd21f', beats:['water'],    base:{ hp:5, atk:1, range:110, spd:52, cd:1.0 } },
};
const ELS = ['water', 'fire', 'wind', 'earth', 'electric'];
// 레벨이 1 오를 때 힘·체력이 몇 배가 되는지. Lv3 하나가 Lv1 둘은 이기고 셋에게는 지도록 맞춘 값
let GROW = 1.5;
const ADV = 1.04;      // 상성일 때 공격 +4%
const HY_BONUS = 1.2;  // 혼합 친구는 힘·체력 +20%
const HY = {
  wind_electric:  { pair:['wind','electric'],  c:'#a58cff', names:['뇌구름','번개 회오리','뇌조','번개 늑대','뇌폭룡'] },
  water_electric: { pair:['water','electric'], c:'#3fd0ff', names:['찌릿방울','번개여우','해일늑대','뇌해사자','뇌해룡'] },
  earth_water:    { pair:['earth','water'],    c:'#5fae8e', names:['진흙콩','이끼바위','바위방울','소용돌흙','샘물골렘'] },
  earth_fire:     { pair:['earth','fire'],     c:'#e0582a', names:['화산콩','용암뿔이','화산거인','마그마왕','화염고목룡'] },
};
for (const k in HY) {
  const [a, b] = HY[k].pair, A = EL[a].base, B = EL[b].base;
  HY[k].label = EL[a].label + '+' + EL[b].label;
  HY[k].beats = EL[a].beats.concat(EL[b].beats);
  HY[k].base = { hp:(A.hp + B.hp) / 2 * HY_BONUS, atk:(A.atk + B.atk) / 2 * HY_BONUS, range:Math.max(A.range, B.range), spd:Math.max(A.spd, B.spd), cd:Math.min(A.cd, B.cd) };
}
const info = k => EL[k] || HY[k];
const isHybrid = k => !!HY[k];
function hybridOf(a, b) {
  for (const k in HY) { const p = HY[k].pair; if ((p[0] === a && p[1] === b) || (p[0] === b && p[1] === a)) return k; }
  return null;
}
const band = lv => Math.floor(lv / HYBRID_LV);
// 두 친구가 합쳐지면 무엇이 되는지 (안 되면 null)
// 같은 원소끼리는 레벨이 달라도 합체: 높은 쪽 레벨 + 1 (단, 레벨 차이가 10 이상이면 안 됨)
const MERGE_GAP = 9;
function mergeResult(a, b) {
  if (!a || !b) return null;
  if (a.el === b.el) { const hi = Math.max(a.lv, b.lv), lo = Math.min(a.lv, b.lv); return hi < MAXLV && hi - lo <= MERGE_GAP ? { el:a.el, lv:hi + 1 } : null; }
  if (!isHybrid(a.el) && !isHybrid(b.el) && a.el !== b.el && a.lv >= HYBRID_LV && b.lv >= HYBRID_LV && band(a.lv) === band(b.lv)) {
    const h = hybridOf(a.el, b.el);
    if (h) return { el:h, lv:Math.min(MAXLV, Math.max(a.lv, b.lv) + 1) };
  }
  return null;
}
function stats(k, lv) {
  const b = info(k).base, m = Math.pow(GROW, lv - 1);
  return { maxhp: b.hp * m, atk: b.atk * m, range: b.range, spd: b.spd, cd: b.cd };
}
function unitName(u) {
  if (isHybrid(u.el)) return HY[u.el].names[hyForm(u.lv)];
  return info(u.el).label + ' 정령';
}
function beatsTarget(a, b) {
  const t = info(a).beats;
  return isHybrid(b) ? HY[b].pair.some(p => t.includes(p)) : t.includes(b);
}

/* ---------- 그림 ---------- */
const SPR = 160;
const SHEETS = { fire:50, wind:50, electric:50, earth:50, water:47, wind_electric:5, water_electric:5, earth_water:5, earth_fire:5 };
const IMGS = {};
for (const k in SHEETS) { const im = new Image(); im.src = 'assets/' + k + '.webp'; IMGS[k] = im; }
const BG = new Image(); BG.src = 'assets/background.webp';
const LOBBY = new Image(); LOBBY.src = 'assets/lobby.webp';
const hyForm = lv => lv >= MAXLV ? 4 : Math.max(0, Math.min(3, band(lv) - 1));
// 레벨 → 그림 번호: Lv1~25는 레벨마다 새 모습, 그 뒤로는 레벨 몇 개마다 바뀜
// 원소별로 쓸 그림 순서. 불은 시트의 Lv1~2(작은 불씨)를 빼고,
// 서로 비슷한 불꽃(시트 Lv3~10) 중 3장만 써서 레벨이 오를 때 모습이 확 바뀌게 함
const ORDER = { fire: [2, 5, 9].concat(Array.from({ length: 40 }, (_, i) => 10 + i)) };
const EARLY = 25;
function spriteIndex(k, lv) {
  if (isHybrid(k)) return hyForm(lv);
  const ord = ORDER[k], n = ord ? ord.length : SHEETS[k];
  const i = lv <= EARLY ? lv - 1 : EARLY + Math.min(n - EARLY - 1, Math.floor((lv - EARLY - 1) * (n - EARLY) / (MAXLV - EARLY)));
  return ord ? ord[i] : i;
}
const sprCache = {};
// 한 칸을 잘라 투명한 여백을 걷어 내고 보관 (적은 붉은 빛을 미리 둘러 둠)
function sprite(k, idx, foe) {
  const key = k + idx + (foe ? 'e' : '');
  if (sprCache[key]) return sprCache[key];
  const im = IMGS[k];
  if (!im.complete || !im.naturalWidth) return null;
  const cols = SHEETS[k] > 5 ? 10 : 5;
  const sx = (idx % cols) * SPR, sy = Math.floor(idx / cols) * SPR;
  // 칸 하나를 따로 꺼내 둠
  const t = document.createElement('canvas'); t.width = t.height = SPR;
  const tg = t.getContext('2d'); tg.drawImage(im, sx, sy, SPR, SPR, 0, 0, SPR, SPR);
  let bx = 0, by = 0, bw = SPR, bh = SPR, ux0 = 0, uy0 = 0, ux1 = SPR, uy1 = SPR;
  try {
    // 덩어리 찾기: 가장 큰 덩어리(몸통)로 크기를 재고, 몸통 아래 따로 떨어진 얼룩(그림자 자국)은 지움
    const id = tg.getImageData(0, 0, SPR, SPR), a = id.data, lab = new Int32Array(SPR * SPR), comps = [];
    for (let p = 0; p < SPR * SPR; p++) {
      if (lab[p] || a[p * 4 + 3] <= 128) continue;
      const cmp = { n: 0, x0: SPR, y0: SPR, x1: 0, y1: 0, id: comps.length + 1 }, st = [p]; lab[p] = cmp.id;
      while (st.length) {
        const q = st.pop(), x = q % SPR, y = (q / SPR) | 0;
        cmp.n++; if (x < cmp.x0) cmp.x0 = x; if (x > cmp.x1) cmp.x1 = x; if (y < cmp.y0) cmp.y0 = y; if (y > cmp.y1) cmp.y1 = y;
        for (const r of [q - 1, q + 1, q - SPR, q + SPR]) {
          if (r < 0 || r >= SPR * SPR || lab[r] || a[r * 4 + 3] <= 128) continue;
          if ((r === q - 1 && x === 0) || (r === q + 1 && x === SPR - 1)) continue;
          lab[r] = cmp.id; st.push(r);
        }
      }
      comps.push(cmp);
    }
    if (comps.length) {
      const main = comps.reduce((m, c) => c.n > m.n ? c : m);
      const drop = new Set(comps.filter(c => c !== main && c.y0 > main.y1 - 4 && c.n < main.n * 0.35).map(c => c.id));
      if (drop.size) {
        for (let p = 0; p < SPR * SPR; p++) if (drop.has(lab[p])) a[p * 4 + 3] = 0;
        // 얼룩 가장자리의 반투명 부분도 정리
        for (let p = 0; p < SPR * SPR; p++) if (!lab[p] && a[p * 4 + 3] > 0 && (p / SPR | 0) > main.y1) a[p * 4 + 3] = 0;
        tg.putImageData(id, 0, 0);
      }
      bx = main.x0; by = main.y0; bw = main.x1 - main.x0 + 1; bh = main.y1 - main.y0 + 1;
      const kept = comps.filter(c => !drop.has(c.id) && c.n > 6);
      ux0 = Math.min(...kept.map(c => c.x0)); uy0 = Math.min(...kept.map(c => c.y0));
      ux1 = Math.max(...kept.map(c => c.x1)) + 1; uy1 = Math.max(...kept.map(c => c.y1)) + 1;
    }
  } catch (e) {}
  // 크기는 몸통으로 재고, 그릴 때는 남은 부분(작은 물방울·빛)도 함께
  const ex = 4, x0 = Math.max(0, ux0 - ex), y0 = Math.max(0, uy0 - ex);
  const x1 = Math.min(SPR, ux1 + ex), y1 = Math.min(SPR, Math.max(uy1, by + bh) + ex);
  const pad = 10, c = document.createElement('canvas');
  c.width = x1 - x0 + pad * 2; c.height = y1 - y0 + pad * 2;
  const g = c.getContext('2d');
  if (foe) { g.shadowColor = 'rgba(230,20,90,0.95)'; g.shadowBlur = 9; }
  g.drawImage(t, x0, y0, x1 - x0, y1 - y0, pad, pad, x1 - x0, y1 - y0);
  c.foot = (y1 - (by + bh)) + pad; // 몸통 발 아래 여백
  c.cx = (bx + bw / 2) - x0 + pad;   // 몸통 가운데
  if (foe) g.drawImage(c, 0, 0);
  c.bw = bw; c.bh = bh;
  return (sprCache[key] = c);
}

/* ---------- 저장 (이 기기 안에만) ---------- */
const SAVE = 'spirit-pals-v2';
function fresh() {
  return { coins:50, stage:1, grid:Array(N).fill(null), found:{}, merged:0, pick:'water', sfxOff:false, musicOff:false, cleared:false,
           quiz:{ digits:'1', ops:'+' } };
}
function load() {
  try {
    let s = JSON.parse(localStorage.getItem(SAVE));
    if (!s) { // 예전 버전 저장을 이어받기 (풀 → 땅)
      s = JSON.parse(localStorage.getItem('spirit-pals-v1'));
      if (s && Array.isArray(s.grid)) { s.grid = s.grid.map(u => u && { el: u.el === 'grass' ? 'earth' : u.el, lv: u.lv }); s.found = {}; }
    }
    if (s && Array.isArray(s.grid) && s.grid.length === N) {
      s.grid = s.grid.map(u => u && info(u.el) ? { el:u.el, lv:Math.max(1, Math.min(MAXLV, u.lv | 0)) } : null);
      s.stage = Math.max(1, Math.min(MAXSTAGE, s.stage | 0));
      const f = fresh(); s.quiz = Object.assign(f.quiz, s.quiz || {});
      if (s.muted) { s.sfxOff = s.musicOff = true; } delete s.muted;
      return Object.assign(f, s);
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
let S = load();

/* ---------- 300판 동안의 성장 곡선 ----------
   부르는 친구 레벨은 30판마다 한 단계: Lv1 → 30판 Lv10 → 60판 Lv20 … → 270판 Lv90.
   같은 원소끼리 합체할 때마다 +1 이라, Lv90 친구에 9번 더 합치면 Lv99. */
const summonLv = st => Math.max(1, Math.min(90, Math.floor(Math.min(st, MAXSTAGE) / 30) * 10));
// 상대 레벨은 판마다 조금씩: 1판 Lv1 → 300판 Lv99
let EN_SLOPE = 0.24, EN_BUDGET = 0.3, EN_CAP = 24;
// 상대 레벨: 부르는 레벨 단계를 따라가며, 한 단계(30판) 동안 약 +7 올라감. 300판(마지막)은 Lv96~99
const enemyLv = st => st >= MAXSTAGE ? 96 : summonLv(st) + Math.floor((st % 30) * EN_SLOPE);
// 코인: 부르기 값 = 10 × 부르는 레벨 (Lv1 10, Lv10 100 … Lv90 900).
// 보상은 '친구 몇 명을 부를 수 있는지'로 정함: 이기면 WIN_X명, 지면 LOSE_X명, 문제 맞히면 QUIZ_X명어치
let WIN_X = 2.2, LOSE_X = 0.8, QUIZ_X = 1.2, TIER_GIFT = 4;
const unitCost = st => 10 * summonLv(st);
const cost = () => unitCost(S.stage);
const winReward = st => Math.round(unitCost(st) * WIN_X);
const loseReward = st => Math.round(unitCost(st) * LOSE_X);
const quizReward = st => Math.round(unitCost(st) * QUIZ_X);

/* ---------- 상대 만들기 (스테이지마다 항상 같은 배치) ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genEnemies(st) {
  const R = rng(st * 7919 + 17), sl = enemyLv(st);
  const boss = st === MAXSTAGE;
  let b = boss ? 20 : Math.min(EN_CAP, 2 + Math.floor(st * EN_BUDGET));
  const maxOff = Math.min(2, 1 + Math.floor(st / 10));  // 상대는 기준 레벨보다 최대 +2
  const g = Array(N).fill(null);
  while (b > 0) {
    const off = Math.floor(R() * (Math.min(maxOff, Math.floor(Math.log2(b))) + 1));
    const empty = []; g.forEach((u, i) => { if (!u) empty.push(i); });
    if (!empty.length) break;
    const front = empty.filter(i => i % COLS === 0);
    const pool = front.length && R() < 0.6 ? front : empty;
    const i = pool[Math.floor(R() * pool.length)];
    const lv = Math.min(MAXLV, sl + off);
    let el = ELS[Math.floor(R() * ELS.length)];
    if (lv >= HYBRID_LV && R() < 0.3) { const ks = Object.keys(HY); el = ks[Math.floor(R() * ks.length)]; }
    g[i] = { el, lv };
    b -= 1 << off;
  }
  return g;
}
let enemy = genEnemies(S.stage);

/* ---------- 소리: 배경음악 + 효과음 (audio 폴더) ----------
   브라우저는 화면을 처음 누른 뒤에만 소리를 낼 수 있어서, 첫 터치 때 준비함 */
const SFX_NAMES = ['tap', 'key', 'summon', 'move', 'merge', 'evolve', 'coin', 'hit', 'crit', 'shoot', 'poof',
                   'correct', 'win', 'lose', 'start', 'finale', 'wrong', 'nope'];
const BGM_CALM = ['01', '02', '03', '04', '05', '06', '09', '10', '12', '14'];  // 합체할 때
const BGM_BATTLE = ['07', '08', '11', '13'];                                     // 싸울 때 (더 신나는 곡)
const MUSIC_VOL = 0.55, SFX_VOL = 0.9;
let AC = null, sfxGain = null, musicGain = null;
const BUF = {}, lastPlay = {};
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = S.sfxOff ? 0 : SFX_VOL; sfxGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = S.musicOff ? 0 : MUSIC_VOL; musicGain.connect(AC.destination);
    SFX_NAMES.forEach(n => fetch('audio/sfx/' + n + '.wav').then(r => r.arrayBuffer())
      .then(b => new Promise((ok, no) => AC.decodeAudioData(b, ok, no))).then(buf => { BUF[n] = buf; }).catch(() => {}));
    Music.init();
  } catch (e) {}
}
// 효과음 한 번 (같은 소리가 너무 촘촘하면 건너뜀). o: { rate, vol, delay, gap, duck }
function sfx(name, o = {}) {
  if (!AC || S.sfxOff || !BUF[name]) return;
  const t = AC.currentTime, gap = o.gap == null ? 0.03 : o.gap;
  if (lastPlay[name] && t - lastPlay[name] < gap) return;
  lastPlay[name] = t;
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = BUF[name];
  if (o.rate) s.playbackRate.value = o.rate;
  g.gain.value = o.vol == null ? 1 : o.vol;
  s.connect(g); g.connect(sfxGain); s.start(t + (o.delay || 0));
  if (o.duck) Music.duck(o.duck);
}
const Music = {
  sets: {}, cur: 'calm',
  init() {
    for (const kind of ['calm', 'battle']) {
      const el = new Audio(); el.preload = 'auto';
      const g = AC.createGain(); g.gain.value = 0;
      AC.createMediaElementSource(el).connect(g); g.connect(musicGain);
      const m = { el, g, list: (kind === 'calm' ? BGM_CALM : BGM_BATTLE).slice().sort(() => Math.random() - 0.5), i: 0 };
      el.addEventListener('ended', () => { m.i = (m.i + 1) % m.list.length; this.load(m); if (this.cur === kind && !S.musicOff) el.play().catch(() => {}); });
      this.sets[kind] = m;
    }
    const want = this.cur; this.cur = null; this.play(want);
  },
  load(m) { m.el.src = 'audio/bgm' + m.list[m.i] + '.m4a'; },
  // 곡 묶음 바꾸기 (천천히 겹쳐서)
  play(kind) {
    if (!AC || !this.sets.calm) { this.cur = kind; return; }
    if (this.cur === kind) return;
    const t = AC.currentTime;
    for (const k in this.sets) {
      const m = this.sets[k], gg = m.g.gain;
      gg.cancelScheduledValues(t); gg.setValueAtTime(gg.value, t);
      if (k === kind) {
        if (!m.el.getAttribute('src')) this.load(m);
        if (!S.musicOff) m.el.play().catch(() => {});
        gg.linearRampToValueAtTime(1, t + 0.8);
      } else {
        gg.linearRampToValueAtTime(0, t + 0.6);
        setTimeout(() => { if (this.cur !== k) m.el.pause(); }, 700);
      }
    }
    this.cur = kind;
  },
  // 짧은 음악(징글)이 나올 때 배경음악을 잠깐 줄임
  duck(sec) {
    if (!musicGain || S.musicOff) return;

    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.6 + Math.random() * 0.4, t: 0, color, r: 3 + Math.random() * 4 });

// 캐릭터 그리기: 숨쉬기·통통 튀기·흔들림 애니메이션은 여기서 만듦
// 크기는 레벨로만 정해지고, 그림마다 들쭉날쭉한 크기는 넓이 기준으로 맞춤
function drawUnit(x, y, k, lv, foe, opt = {}) {
  const s = opt.s || 1, t = now, ph = x * 0.071 + y * 0.037;
  const size = (38 + lv * 0.25 + (isHybrid(k) ? 5 : 0)) * s;
  const breathe = Math.sin(t * 3.1 + ph) * 0.035;
  const bob = Math.abs(Math.sin(t * 2.2 + ph)) * -2.5 * s;
  const sway = Math.sin(t * 1.7 + ph) * 0.04;
  ctx.save();
  ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
  ctx.fillStyle = 'rgba(20,30,10,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y + size * 0.5, size * 0.42 * (1 + bob / 40), size * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  const img = sprite(k, spriteIndex(k, lv), foe);
  ctx.translate(x, y + size * 0.52 + bob);
  ctx.rotate(sway);
  ctx.scale((opt.flip ? -1 : 1) * (1 - breathe * 0.6), 1 + breathe);
  if (img) {
    const f = Math.min(size / Math.sqrt(img.bw * img.bh), size * 1.35 / Math.max(img.bw, img.bh));
    const dw = img.width * f, dh = img.height * f;
    ctx.drawImage(img, -img.cx * f, -dh + img.foot * f, dw, dh);
    if (opt.hit > 0) { // 맞으면 하얗게 번쩍

    }

    ctx.beginPath(); ctx.arc(0, -size * 0.45, size * 0.4, 0, Math.PI * 2); ctx.fillStyle = info(k).c; ctx.fill();
  }
  ctx.restore();
  if (opt.badge !== false) {
    const bx = x + CELL * 0.33, by = y + CELL * 0.34, w = lv >= 10 ? 22 : 16;
    rr(bx - w / 2, by - 8, w, 16, 8);
    ctx.fillStyle = foe ? '#ff4d7a' : (isHybrid(k) ? '#ffd23f' : '#fff'); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = foe ? '#7a1030' : '#3b2b4f'; ctx.stroke();
    text(String(lv), bx, by + 0.5, 11, foe ? '#fff' : '#3b2b4f');
  }
}

/* ---------- 게임 흐름 ---------- */
// mode: merge | battle | result | quiz | settings
let mode = 'merge', B = null, speed = 1, result = null, drag = null, now = 0, Q = null;

function cellPos(side, i) {
  const c = i % COLS, r = Math.floor(i / COLS), x0 = side === 'p' ? PX : EX;
  return { x: x0 + c * CELL + CELL / 2, y: GY + r * CELL + CELL / 2 };
}
function cellAt(x, y) {
  const c = Math.floor((x - PX) / CELL), r = Math.floor((y - GY) / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return r * COLS + c;
}
function discover(u) {
  const key = u.el + ':' + spriteIndex(u.el, u.lv);
  if (S.found[key]) return false;
  S.found[key] = 1;
  return true;
}

function buy() {
  const c = cost();
  const empty = []; S.grid.forEach((u, i) => { if (!u) empty.push(i); });
  if (!empty.length) { toast('자리가 꽉 찼어요! 같은 친구끼리 합체해 봐요'); sfx('nope'); return; }
  if (S.coins < c) { toast('코인이 모자라요. 싸워서 코인을 모아요!'); sfx('nope'); return; }
  S.coins -= c;
  const i = empty[Math.floor(Math.random() * empty.length)];
  const el = EL[S.pick] ? S.pick : 'water';  // 고른 원소
  const u = { el, lv: summonLv(S.stage) };
  S.grid[i] = u; pops[i] = 1;
  const p = cellPos('p', i); burst(p.x, p.y, EL[el].c, 8);
  sfx('summon', { gap: 0.06 });
  if (discover(u)) toast('새 친구! ' + unitName(u) + ' Lv.' + u.lv, 1.6);
  save();
}

function mkF(side, u, i) {
  const p = cellPos(side, i), s = stats(u.el, u.lv);
  return Object.assign({ side, el: u.el, lv: u.lv, x: p.x, y: p.y, hp: s.maxhp, cdT: Math.random() * 0.5, lunge: 0, hit: 0, dead: false, deadT: 0, look: side === 'p' ? 0 : Math.PI }, s);
}
function startBattle() {
  if (!S.grid.some(Boolean)) { toast('먼저 "친구 부르기"를 눌러요!'); return; }
  const F = [];
  S.grid.forEach((u, i) => { if (u) F.push(mkF('p', u, i)); });
  enemy.forEach((u, i) => { if (u) F.push(mkF('e', u, i)); });
  B = { F, proj: [], t: 0, over: null, overT: 0 };
  mode = 'battle'; speed = 1;
  sfx('start', { duck: 0.9 }); Music.play('battle');
}
function hitF(a, b) {
  if (b.dead) return;
  const adv = beatsTarget(a.el, b.el);
  const dmg = a.atk * (adv ? ADV : 1) * (0.97 + Math.random() * 0.06);
  b.hp -= dmg; b.hit = 0.15;
  floatText(b.x + (Math.random() - 0.5) * 16, b.y - 30, adv ? '상성! ' + fmt(dmg) : fmt(dmg), adv ? '#ffd23f' : '#fff');
  sfx(adv ? 'crit' : 'hit', { gap: 0.05, vol: 0.75, rate: 0.9 + Math.random() * 0.2 });
  if (b.hp <= 0) { b.dead = true; b.deadT = 0; burst(b.x, b.y, info(b.el).c, 14); sfx('poof', { gap: 0.06 }); }
}
function stepBattle(dt) {
  B.t += dt;
  const F = B.F;
  // 매번 순서를 섞어서 어느 편도 먼저 때리는 이득이 없게
  const order = F.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  for (const f of order) {
    if (f.dead) { f.deadT += dt; continue; }
    f.cdT -= dt; f.lunge = Math.max(0, f.lunge - dt); f.hit = Math.max(0, f.hit - dt);
    let best = null, bd = 1e9;
    for (const g of F) { if (g.dead || g.side === f.side) continue; const d = Math.hypot(g.x - f.x, g.y - f.y); if (d < bd) { bd = d; best = g; } }
    if (!best) continue;
    f.look = Math.atan2(best.y - f.y, best.x - f.x);
    if (bd > f.range) { const k = Math.min(1, f.spd * dt / bd); f.x += (best.x - f.x) * k; f.y += (best.y - f.y) * k; }
    else if (f.cdT <= 0) {
      f.cdT = f.cd; f.lunge = 0.18;
      if (f.range > 60) { B.proj.push({ x: f.x, y: f.y - 12, t: best, src: f }); sfx('shoot', { gap: 0.08, vol: 0.6 }); }
      else hitF(f, best);
    }
    for (const g of F) {
      if (g === f || g.dead || g.side !== f.side) continue;
      const dx = f.x - g.x, dy = f.y - g.y, d = Math.hypot(dx, dy) || 0.01;
      if (d < 34) { const p = (34 - d) / d * Math.min(1, dt * 6); f.x += dx * p * 0.5; f.y += dy * p * 0.5; }
    }
    f.x = Math.max(PX - 20, Math.min(EX + COLS * CELL + 20, f.x)); f.y = Math.max(GY + 16, Math.min(GY + ROWS * CELL - 16, f.y));
  }
  B.proj = B.proj.filter(p => {
    if (p.t.dead) return false;
    const dx = p.t.x - p.x, dy = p.t.y - 12 - p.y, d = Math.hypot(dx, dy);
    if (d < 12) { hitF(p.src, p.t); return false; }
    const k = Math.min(1, 340 * dt / d); p.x += dx * k; p.y += dy * k; return true;
  });
  if (!B.over) {
    const pa = F.some(f => !f.dead && f.side === 'p'), ea = F.some(f => !f.dead && f.side === 'e');
    if (!ea) B.over = 'win'; else if (!pa || B.t > 90) B.over = 'lose';
  } else {
    B.overT += dt;
    if (B.overT > 1.0) endBattle(B.over === 'win');
  }
}
function endBattle(win) {
  const reward = win ? winReward(S.stage) : loseReward(S.stage);
  S.coins += reward;
  const oldSl = summonLv(S.stage);
  result = { win, reward, stage: S.stage, quizDone: false };
  if (win) {
    if (S.stage >= MAXSTAGE) { S.cleared = true; result.final = true; }
    else S.stage++;
    result.slUp = summonLv(S.stage) > oldSl ? summonLv(S.stage) : 0;
    if (result.slUp) { // 부르는 레벨이 오르면 새 친구 TIER_GIFT명어치 코인 선물
      result.gift = unitCost(S.stage) * TIER_GIFT; S.coins += result.gift; result.reward += result.gift;
    }
    sfx(result.final ? 'finale' : 'win', { duck: result.final ? 3.6 : 1.4 }); sfx('coin', { delay: result.final ? 3.2 : 1.1, gap: 0 });
    for (let i = 0; i < 5; i++) burst(260 + i * 110, 200, info(ELS[i]).c, result.final ? 30 : 14);
  } else { sfx('lose', { duck: 1.4 }); sfx('coin', { delay: 1.2, gap: 0, vol: 0.7 }); }
  save(); mode = 'result';
}
function closeResult() { mode = 'merge'; B = null; result = null; enemy = genEnemies(S.stage); sfx('tap'); Music.play('calm'); }

/* ---------- 수학 문제 (지면 코인을 더 받을 기회) ---------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function makeProblem() {
  const d = S.quiz.digits, ops = S.quiz.ops;
  const op = ops === '+-' ? (Math.random() < 0.5 ? '+' : '-') : ops;
  let a, b;
  if (d === '1') { a = rnd(1, 9); b = rnd(1, 9); }
  else if (d === '2') { a = rnd(10, 99); b = rnd(10, 99); }
  else { a = rnd(1, 9); b = rnd(10, 99); if (Math.random() < 0.5) [a, b] = [b, a]; }
  if (op === '-' && a < b) [a, b] = [b, a]; // 답이 0보다 작지 않게
  return { a, b, op, ans: op === '+' ? a + b : a - b };
}
function openQuiz() { Q = Object.assign(makeProblem(), { input: '', tries: 0, state: 'ask', t: 0 }); mode = 'quiz'; sfx('tap'); }
function quizKey(k) {
  if (!Q || Q.state !== 'ask') return;
  if (k === '←') { Q.input = Q.input.slice(0, -1); sfx('key', { rate: 0.8, gap: 0 }); return; }
  if (k === '확인') {
    if (!Q.input) return;
    if (Number(Q.input) === Q.ans) {
      const bonus = quizReward(result.stage);
      S.coins += bonus; save();
      Q.state = 'right'; Q.bonus = bonus; Q.t = 0;
      sfx('correct', { duck: 2.2 }); sfx('coin', { delay: 0.6, gap: 0 });
      burst(480, 200, '#ffd23f', 24); burst(480, 200, '#5fc95f', 16);
    } else {
      Q.tries++; Q.t = 0; Q.shake = 0.4; sfx('wrong');
      if (Q.tries >= 3) Q.state = 'reveal'; else Q.input = '';
    }
    return;
  }
  if (Q.input.length < 3) { Q.input += k; sfx('key', { rate: 0.9 + Number(k) * 0.035, gap: 0 }); }
}
function closeQuiz() { result.quizDone = true; Q = null; mode = 'result'; }
addEventListener('keydown', e => {
  audioInit();
  if (modal === 'pin') {
    if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('←'); else if (e.key === 'Escape') pinKey('취소');
    return;
  }
  if (mode !== 'quiz' || modal) return;
  if (/^[0-9]$/.test(e.key)) quizKey(e.key);
  else if (e.key === 'Backspace') quizKey('←');
  else if (e.key === 'Enter') { if (Q && Q.state === 'ask') quizKey('확인'); else closeQuiz(); }
});

/* ---------- 입력 ---------- */
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  audioInit();
  const p = toLogical(e);
  for (let k = btns.length - 1; k >= 0; k--) {
    const b = btns[k];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (mode !== 'merge' || modal || screen !== 'game') return;
  const i = cellAt(p.x, p.y);
  if (i >= 0 && S.grid[i]) { drag = { i, x: p.x, y: p.y, sx: p.x, sy: p.y }; cv.setPointerCapture(e.pointerId); sfx('tap', { vol: 0.6 }); }
});

cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  const j = cellAt(d.x, d.y), a = S.grid[d.i];
  if (!a) return;
  if (Math.hypot(d.x - d.sx, d.y - d.sy) < 8) { // 톡 누르면 이름 보기
    const st = stats(a.el, a.lv);
    let tip = '';
    if (!isHybrid(a.el) && a.lv >= HYBRID_LV) {
      const mates = Object.values(HY).filter(h => h.pair.includes(a.el)).map(h => EL[h.pair[0] === a.el ? h.pair[1] : h.pair[0]].label);
      if (mates.length) tip = '  · ' + mates.join('/') + '와 혼합 가능';
    }
    toast(unitName(a) + ' Lv.' + a.lv + '  체력 ' + fmt(st.maxhp) + ' · 힘 ' + fmt(st.atk) + tip, 2.2);
    return;
  }
  // 친구 부르기 버튼 위에 놓으면: 친구를 숲으로 보내고 코인 조금 돌려받기
  if (d.x >= PX - 6 && d.x <= PX + COLS * CELL + 6 && d.y >= 440) {
    const back = Math.max(1, Math.floor(cost() / 2));
    S.grid[d.i] = null; S.coins += back; save();
    const p = cellPos('p', d.i); burst(p.x, p.y, info(a.el).c, 10);
    toast('잘 가! ' + unitName(a) + ' 숲으로 돌아갔어요 (+' + back + ' 코인)', 1.8); sfx('poof'); sfx('coin', { delay: 0.2, gap: 0 });
    return;
  }
  if (j < 0 || j === d.i) return;
  const b = S.grid[j];
  const m = mergeResult(a, b);
  if (!b) { S.grid[j] = a; S.grid[d.i] = null; pops[j] = 0.5; sfx('move'); }
  else if (m) {
    const hybridNew = m.el !== a.el;
    S.grid[j] = m; S.grid[d.i] = null; pops[j] = 1; S.merged++;
    const p = cellPos('p', j);
    burst(p.x, p.y, info(a.el).c, 16); burst(p.x, p.y, info(b.el).c, hybridNew ? 16 : 0); burst(p.x, p.y, '#fff7b0', 8);
    rings.push({ x: p.x, y: p.y, t: 0, color: info(m.el).c });
    if (hybridNew) { rings.push({ x: p.x, y: p.y, t: -0.15, color: '#ffd23f' }); sfx('evolve', { duck: 1.2 }); }
    else sfx('merge', { rate: Math.min(1.3, 0.9 + m.lv * 0.004) });
    const isNew = discover(m);
    if (hybridNew) toast('혼합 진화! ' + unitName(m) + ' Lv.' + m.lv, 2.4);
    else if (m.lv === MAXLV) toast('최고 레벨 달성! ' + unitName(m) + ' Lv.99', 2.4);
    else if (isNew) toast('진화! ' + unitName(m) + ' Lv.' + m.lv, 1.6);
  } else if (b.el === a.el) { toast(Math.max(a.lv, b.lv) >= MAXLV ? '이미 최고 레벨이에요!' : '레벨 차이가 10 넘게 나면 합체할 수 없어요'); sfx('nope'); }
  else { S.grid[j] = a; S.grid[d.i] = b; pops[j] = 0.4; pops[d.i] = 0.4; sfx('move'); }
  save();
});
cv.addEventListener('pointercancel', () => { drag = null; });

  }
}
function toggleSfx() { S.sfxOff = !S.sfxOff; save(); if (sfxGain) sfxGain.gain.value = S.sfxOff ? 0 : SFX_VOL; sfx('tap'); }
function toggleMusic() { S.musicOff = !S.musicOff; save(); Music.setOn(!S.musicOff); sfx('tap'); }

/* ---------- 화면 그리기 ---------- */
function drawBackground() {
  // 배경 그림은 화면 전체를 덮도록 (잘리는 부분은 가장자리)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (BG.complete && BG.naturalWidth) {
    const k = Math.max(vw / BG.naturalWidth, vh / BG.naturalHeight);
    const w = BG.naturalWidth * k, h = BG.naturalHeight * k;
    ctx.drawImage(BG, (vw - w) / 2, (vh - h) / 2, w, h);
  } else {
    const g = ctx.createRadialGradient(vw / 2, vh * 0.55, 10, vw / 2, vh * 0.55, Math.max(vw, vh) * 0.7);
    g.addColorStop(0, '#8db547'); g.addColorStop(0.6, '#5e8c2e'); g.addColorStop(1, '#3d6420');
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = 'rgba(40,70,20,0.55)';
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc((i + 0.5) * vw / 9, -vh * 0.02, vw / 11, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
}

function drawBoard() {
  rr(PX - 8, GY - 8, COLS * CELL + 16, ROWS * CELL + 16, 20); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
  rr(EX - 8, GY - 8, COLS * CELL + 16, ROWS * CELL + 16, 20); ctx.fillStyle = 'rgba(120,40,120,0.22)'; ctx.fill();
  const showCells = mode !== 'battle';
  const dragU = drag && S.grid[drag.i];
  for (let i = 0; i < N; i++) {
    const c = i % COLS, r = Math.floor(i / COLS);
    if (showCells) { rr(EX + c * CELL + 4, GY + r * CELL + 4, CELL - 8, CELL - 8, 12); ctx.fillStyle = 'rgba(255,230,255,0.22)'; ctx.fill(); }
    rr(PX + c * CELL + 4, GY + r * CELL + 4, CELL - 8, CELL - 8, 12);
    let hl = null;
    if (dragU && i !== drag.i) { const m = mergeResult(dragU, S.grid[i]); if (m) hl = m.el !== dragU.el ? 'hy' : 'same'; }
    ctx.fillStyle = hl === 'hy' ? 'rgba(190,150,255,0.85)' : hl ? 'rgba(255,230,90,0.8)' : showCells ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.15)'; ctx.fill();
    if (hl) { ctx.lineWidth = 3; ctx.strokeStyle = hl === 'hy' ? '#7b4dff' : '#f0a500'; ctx.stroke(); }
  }
  outlined('내 친구들', PX + COLS * CELL / 2, GY - 12, 12, '#fff', '#2d4a14');
  outlined('말썽 정령들', EX + COLS * CELL / 2, GY - 12, 12, '#ffd0e0', '#5a1030');
}

  S.grid.forEach((u, i) => {
    if (!u || (drag && drag.i === i)) return;
    const p = cellPos('p', i), k = pops[i];
    drawUnit(p.x, p.y, u.el, u.lv, false, { s: 1 + Math.sin(k * Math.PI) * 0.25 });

function drawBattle() {
  const F = B.F.slice().sort((a, b) => a.y - b.y);
  for (const f of F) {
    if (f.dead && f.deadT > 0.4) continue;
    const lz = Math.sin(f.lunge / 0.18 * Math.PI) * 10;
    const sh = f.hit > 0 ? (Math.random() - 0.5) * 4 : 0;
    drawUnit(f.x + Math.cos(f.look) * lz + sh, f.y + Math.sin(f.look) * lz, f.el, f.lv, f.side === 'e',
      { s: f.dead ? 1 - f.deadT : 1, alpha: f.dead ? 1 - f.deadT / 0.4 : 1, flip: Math.cos(f.look) < 0, hit: f.hit, badge: false });
    if (!f.dead) {
      const w = 34, y = f.y - 38;
      rr(f.x - w / 2, y, w, 6, 3); ctx.fillStyle = 'rgba(20,10,30,0.5)'; ctx.fill();
      rr(f.x - w / 2, y, w * Math.max(0, f.hp / f.maxhp), 6, 3); ctx.fillStyle = f.side === 'p' ? '#5fd35f' : '#ff6b6b'; ctx.fill();
    }
  }
  for (const p of B.proj) {
    const col = info(p.src.el).c;
    if (p.src.el.includes('electric')) { // 지그재그 번개
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x - 6, p.y - 6);
      ctx.lineTo(p.x + 2, p.y - 1); ctx.lineTo(p.x - 2, p.y + 1); ctx.lineTo(p.x + 6, p.y + 6); ctx.stroke();
    } else {
      ctx.fillStyle = col; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 4, now * 12, now * 12 + 4); ctx.stroke();
    }
  }
  if (B.over) outlined(B.over === 'win' ? '이겼다!' : '앗...', W / 2, 250, 52, B.over === 'win' ? '#ffd23f' : '#cfd8ff');
}

function dimAll(color) { ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = color; ctx.fillRect(0, 0, vw, vh); ctx.restore(); }
function panel(x, y, w, h, border) {

}

function drawFx(dt) {
  parts = parts.filter(p => (p.t += dt) < p.life);
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  rings = rings.filter(r => (r.t += dt) < 0.5);
  for (const r of rings) {
    if (r.t < 0) continue;
    ctx.globalAlpha = 1 - r.t / 0.5; ctx.strokeStyle = r.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 120, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  texts = texts.filter(t => (t.t += dt) < 0.8);
  for (const t of texts) { ctx.globalAlpha = 1 - t.t / 0.8; outlined(t.txt, t.x, t.y - t.t * 30, 15, t.color); }
  ctx.globalAlpha = 1;
  if (toastMsg) {
    toastMsg.t += dt;
    if (toastMsg.t > toastMsg.dur) toastMsg = null;
    else {
      const a = Math.min(1, toastMsg.t * 6, (toastMsg.dur - toastMsg.t) * 4);
      ctx.globalAlpha = a; ctx.font = 'bold 16px ' + FONT;
      const w = Math.min(W - 40, ctx.measureText(toastMsg.txt).width + 34);
      rr(W / 2 - w / 2, 400, w, 40, 20); ctx.fillStyle = 'rgba(40,30,60,0.92)'; ctx.fill();
      text(toastMsg.txt, W / 2, 421, 16, '#fff');
      ctx.globalAlpha = 1;
    }
  }
}

function drawRotateHint() {
  if (vh <= vw * 1.05) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(20,10,30,0.82)'; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(vw / 2, vh / 2 - 40); ctx.rotate(Math.sin(now * 2) * 0.4 - 0.4);
  rr(-30, -50, 60, 100, 10); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
  text('휴대폰을 가로로 돌려 주세요', vw / 2, vh / 2 + 50, 20, '#fff');
}

/* ---------- 놀이 시간 관리 (어른용) ----------
   로비에서 30분/1시간을 고르고 '시간 코인'을 확인한 뒤 시작. 시간이 끝나면 잠김.
   어른 비밀번호(4자리)로 열거나, 다음날 0시가 지나면 저절로 풀림.
   비밀번호·아이 이름·시간 정보는 이 기기 안에만 저장됨 (인터넷으로 보내지 않음) */
const PKEY = 'spirit-pals-parent';
function loadP() {
  const d = { pin: null, name: '', lockDate: null, sessionEnd: 0, warned: 0 };
  try { return Object.assign(d, JSON.parse(localStorage.getItem(PKEY)) || {}); } catch (e) { return d; }
}
let P = loadP();
function saveP() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} }
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const CHILD_NAME = '현';  // 기본 이름 (어른 설정에서 바꿀 수 있음)
function nameCall() { // 받침 있으면 '아', 없으면 '야' (예: 현아, 지우야)
  const n = (P.name || CHILD_NAME).trim();
  const c = n.charCodeAt(n.length - 1);
  return n + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0 ? '아' : '야');
}
let screen = 'lobby', modal = null, PIN = null, pendingMins = 30;
function startScreen() {
  if (P.lockDate === dayKey()) screen = 'locked';
  else if (P.sessionEnd > Date.now()) screen = 'game';
  else if (P.sessionEnd && dayKey(P.sessionEnd) === dayKey()) lockNow();
  else { if (P.lockDate) { P.lockDate = null; saveP(); } screen = 'lobby'; }
}
function lockNow() {
  P.lockDate = dayKey(); P.sessionEnd = 0; saveP();
  screen = 'locked'; modal = null; PIN = null; drag = null;
  B = null; result = null; Q = null; mode = 'merge'; enemy = genEnemies(S.stage);
  for (const k in Music.sets) Music.sets[k].el.pause();
  sfx('lose');
}
function checkTime() {
  if (screen === 'locked') {
    if (P.lockDate !== dayKey()) { P.lockDate = null; saveP(); screen = 'lobby'; Music.setOn(!S.musicOff); } // 다음날 0시 자동 풀림
    return;
  }
  if (screen !== 'game') return;
  const left = P.sessionEnd - Date.now();
  if (left <= 0) { lockNow(); return; }
  if (left <= 60000 && P.warned < 2) { P.warned = 2; saveP(); toast('1분 남았어요!', 2.5); sfx('nope'); }
  else if (left <= 300000 && P.warned < 1) { P.warned = 1; saveP(); toast('5분 남았어요!', 2.5); sfx('tap'); }
}
function chooseTime(mins) {
  sfx('tap'); pendingMins = mins;
  if (!P.pin) { openPin('set', () => { modal = 'coin'; }); return; }
  modal = 'coin';
}
function coinYes() {
  P.sessionEnd = Date.now() + pendingMins * 60000; P.warned = 0; saveP();
  modal = null; screen = 'game'; mode = 'merge'; enemy = genEnemies(S.stage);
  sfx('start'); Music.play('calm');
}
function coinNo() { modal = null; sfx('nope'); toast('시간 코인을 넣고 다시 눌러 줘!', 2.4); }
function openParent() { sfx('tap'); openPin(P.pin ? 'ask' : 'set', () => { modal = 'settings'; }); }
function openPin(purpose, onOk) { PIN = { purpose, step: 1, input: '', first: '', msg: '', onOk, shake: 0 }; modal = 'pin'; }
function pinKey(k) {
  if (!PIN) return;
  if (k === '취소') { PIN = null; modal = null; sfx('tap'); return; }
  if (k === '←') { PIN.input = PIN.input.slice(0, -1); sfx('key', { rate: 0.8, gap: 0 }); return; }
  if (PIN.input.length >= 4) return;
  PIN.input += k; sfx('key', { rate: 0.9 + Number(k) * 0.035, gap: 0 });
  if (PIN.input.length < 4) return;
  if (PIN.purpose === 'set') {
    if (PIN.step === 1) { PIN.first = PIN.input; PIN.input = ''; PIN.step = 2; PIN.msg = ''; }
    else if (PIN.input === PIN.first) { P.pin = PIN.input; saveP(); const f = PIN.onOk; PIN = null; modal = null; toast('비밀번호를 정했어요'); sfx('correct'); if (f) f(); }
    else { PIN.step = 1; PIN.input = ''; PIN.first = ''; PIN.msg = '두 번 누른 숫자가 달라요. 다시 정해 주세요'; PIN.shake = 0.4; sfx('wrong'); }
  } else if (PIN.input === P.pin) { const f = PIN.onOk; PIN = null; modal = null; sfx('correct'); if (f) f(); }
  else { PIN.input = ''; PIN.msg = '비밀번호가 달라요'; PIN.shake = 0.4; sfx('wrong'); }
}
function unlockByPin() {
  sfx('tap');
  openPin('ask', () => { P.lockDate = null; saveP(); screen = 'lobby'; Music.setOn(!S.musicOff); toast('잠금을 풀었어요'); });
}
function changeName() {
  const n = prompt('아이 이름을 적어 주세요 (이 기기에만 저장돼요)', P.name || '');
  if (n != null) { P.name = n.trim().slice(0, 10); saveP(); }
}

function drawLobby() {
  // 위쪽 가운데: 로비 그림 (천천히 숨쉬듯 움직임)
  if (LOBBY.complete && LOBBY.naturalWidth) {
    const h = 214 * (1 + Math.sin(now * 2) * 0.02), w = h * LOBBY.naturalWidth / LOBBY.naturalHeight;
    ctx.drawImage(LOBBY, W / 2 - w / 2, 120 - h / 2 + Math.sin(now * 1.5) * 3, w, h);
  }
  outlined('오늘은 얼마나 놀까?', W / 2, 270, 26, '#fff', '#2d4a14');
  button(250, 312, 210, 118, '30분', '#5fc95f', () => chooseTime(30), null, false, 42);
  button(500, 312, 210, 118, '1시간', '#4aa8ff', () => chooseTime(60), null, false, 42);
  if (!P.pin) outlined('처음에는 어른이 비밀번호 4자리를 먼저 정해요', W / 2, 452, 14, '#fff', '#2d4a14');
  ELS.forEach((el, i) => drawUnit(250 + i * 115, 500, el, 5 + i * 4, false, { badge: false, s: 0.8 }));
  button(W - 150, H - 56, 136, 42, '어른 설정', '#a88bd6', openParent, null, false, 17);
}
function drawLocked() {
  dimAll('rgba(20,10,40,0.6)');
  outlined('아쉽지만, 오늘 게임 시간은 끝났어!', W / 2, 140, 42, '#fff', '#3b2b4f');
  outlined(nameCall() + '!', W / 2, 210, 60, '#ffd23f', '#7a3510');
  drawUnit(W / 2 - 70, 360, 'water', 9, false, { badge: false, s: 1.3 });
  drawUnit(W / 2 + 70, 360, 'fire', 9, false, { badge: false, s: 1.3, flip: true });
  button(W / 2 - 120, 440, 240, 54, '어른: 비밀번호로 열기', '#8a7aa8', unlockByPin, null, false, 18);
}
function drawCoinAsk() {
  btns = [];
  panel(170, 80, 620, 380, '#ffb02e');
  coinIcon(W / 2, 140, 30);
  outlined('시간 코인은 넣었어?', W / 2, 225, 58, '#fff', '#7a3510');
  text((pendingMins === 60 ? '1시간' : pendingMins + '분') + ' 동안 놀아요', W / 2, 282, 20, '#5a3d7a');
  button(230, 330, 230, 96, '네', '#5fc95f', coinYes, null, false, 42);
  button(500, 330, 230, 96, '아니요', '#cfc6d8', coinNo, null, false, 36);
}
function drawPinPad(dt) {
  btns = [];
  panel(250, 24, 460, 492, '#a88bd6');
  PIN.shake = Math.max(0, PIN.shake - dt);
  const title = PIN.purpose === 'set' ? (PIN.step === 1 ? '어른 비밀번호 4자리를 정해요' : '한 번 더 눌러 주세요') : '어른 비밀번호를 눌러 주세요';
  outlined(title, W / 2, 66, 24, '#fff', '#4a2a8a');
  const sh = PIN.shake ? Math.sin(now * 60) * 8 : 0;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.arc(W / 2 - 66 + i * 44 + sh, 112, 13, 0, Math.PI * 2);
    ctx.fillStyle = i < PIN.input.length ? '#4a2a8a' : 'rgba(74,42,138,0.18)'; ctx.fill();
  }
  if (PIN.msg) text(PIN.msg, W / 2, 146, 15, '#c94a1a');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '취소', '0', '←'].forEach((k, i) => {
    const c = i % 3, r = Math.floor(i / 3), x = W / 2 - 138 + c * 94, y = 168 + r * 82;
    button(x, y, 88, 72, k, k === '취소' ? '#cfc6d8' : k === '←' ? '#ffa24c' : '#7fb2ff', () => pinKey(k), null, false, k === '취소' ? 20 : 30);
  });
}
function drawTimer() {
  const left = Math.max(0, P.sessionEnd - Date.now()), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  const cx = (PX + COLS * CELL + EX) / 2, warn = left <= 60000, mid = left <= 300000;
  rr(cx - 92, 60, 184, 40, 20); ctx.fillStyle = warn ? '#ff5a6e' : mid ? '#ffb02e' : 'rgba(255,255,255,0.9)'; ctx.fill();
  const label = '남은 시간 ' + m + ':' + String(sec).padStart(2, '0');
  if (warn || mid) outlined(label, cx, 81, warn ? 21 + Math.sin(now * 8) : 20, '#fff', '#7a1030');
  else text(label, cx, 81, 20, '#3b2b4f');
}

startScreen();

let last = performance.now();
const SHOW_FPS = /fps/.test(location.search); let fpsN = 0, fpsT = 0, fpsV = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  for (let i = 0; i < N; i++) pops[i] = Math.max(0, pops[i] - dt * 3);
  checkTime();
  if (screen === 'game' && !modal && mode === 'battle') stepBattle(dt * speed);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawBackground();
  btns = [];
  if (screen === 'game') {
    drawBoard();
    drawPicker();
    drawMiddle();
    if (mode === 'battle') drawBattle(); else drawMergeUnits();
    drawTop();
    drawBottom();
    drawTimer();
    if (mode === 'result') drawResult();
    if (mode === 'quiz') drawQuiz(dt);
  } else if (screen === 'lobby') drawLobby();
  else drawLocked();
  if (modal === 'coin') drawCoinAsk();
  else if (modal === 'pin') drawPinPad(dt);
  else if (modal === 'settings') drawSettings();
  drawFx(dt);
  drawRotateHint();
  if (SHOW_FPS) { // 주소 끝에 ?fps 를 붙이면 화면 왼쪽 위에 초당 프레임 수 표시 (느림 확인용)
    fpsN++; if (t - fpsT >= 1000) { fpsV = Math.round(fpsN * 1000 / (t - fpsT)); fpsN = 0; fpsT = t; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.font = 'bold ' + Math.round(14 * dpr) + 'px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 150 * dpr, 22 * dpr); ctx.fillStyle = '#0f0';
    ctx.fillText(fpsV + ' fps  ' + cv.width + 'x' + cv.height, 4 * dpr, 11 * dpr);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 인터넷 없이도 실행되도록 (https 주소로 열었을 때만 동작)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
